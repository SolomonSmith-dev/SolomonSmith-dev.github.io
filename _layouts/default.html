<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}
  {% feed_meta %}

  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}" sizes="180x180">
  <meta name="theme-color" content="#0A0E0A">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "{{ site.url }}/#person",
    "name": "Solomon Smith",
    "url": "{{ site.url }}/",
    "image": "{{ site.url }}/assets/images/headshot.jpg",
    "email": "mailto:{{ site.email }}",
    "jobTitle": "AI/ML Engineer",
    "description": "{{ site.bio }}",
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "California State University, San Bernardino"
    },
    "knowsAbout": ["Machine Learning", "Large Language Models", "Retrieval-Augmented Generation", "Multi-Agent Systems", "Python", "FastAPI", "Backend Engineering"],
    "sameAs": [
      "https://github.com/{{ site.github_username }}",
      "https://linkedin.com/in/{{ site.linkedin_username }}"
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <div class="shell site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">Solomon Smith</a>
    <nav class="site-nav">
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>~/about</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}class="active"{% endif %}>~/projects</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' or page.url contains '/20' %}class="active"{% endif %}>~/writing</a>
      <a href="{{ '/resume/' | relative_url }}" {% if page.url contains '/resume' %}class="active"{% endif %}>~/resume</a>
    </nav>
  </div>
</header>

<main class="shell" id="main-content">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="shell site-footer__inner">
    <p>Solomon Smith. AI/ML engineer. Internships Summer 2026. Full-time Jan 2027.</p>
    <ul>
      <li><a href="mailto:{{ site.email }}">email</a></li>
      <li><a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">github</a></li>
      <li><a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener">linkedin</a></li>
      <li><a href="{{ '/card' | relative_url }}">card</a></li>
      <li><button class="term-hint" id="term-hint-btn" title="open terminal">[/]</button></li>
    </ul>
  </div>
</footer>

<script defer src="{{ '/assets/js/rain.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/easter-eggs.js' | relative_url }}"></script>

</body>
</html>
