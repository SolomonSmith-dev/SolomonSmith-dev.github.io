---
layout: default
---

<article class="page">
  {%- if page.title -%}
  <header class="intro">
    <h1 class="page-heading">{{ page.title }}</h1>
    {%- if page.lede -%}
    <p class="page-lede">{{ page.lede }}</p>
    {%- endif -%}
  </header>
  {%- endif -%}

  <div class="prose">
    {{ content }}
  </div>
</article>
