---
layout: default
---

<article class="page{% if page.wide %} page--wide{% endif %}">
  {%- if page.title -%}
  <header class="intro">
    {%- if page.eyebrow -%}<span class="eyebrow">{{ page.eyebrow }}</span>{%- endif -%}
    <h1 class="page-heading">{{ page.heading | default: page.title }}</h1>
    {%- if page.lede -%}
    <p class="page-lede">{{ page.lede }}</p>
    {%- endif -%}
  </header>
  {%- endif -%}

  <div class="prose">
    {{ content }}
  </div>
</article>
