---
layout: default
---

<section class="hero" aria-labelledby="hero-title">
  <div class="hero__copy">
    <h1 id="hero-title">
      <span class="hero__name">Solomon Smith</span>
      <span class="hero__title">Forward Deployed Engineer</span>
    </h1>
    <p class="hero__sub">{{ page.hero_sub }}</p>
    <p class="hero__lede">{{ page.hero_lede }}</p>
    <div class="btn-row">
      <a class="btn btn--primary" href="mailto:{{ site.email }}?subject=Opportunity%20for%20Solomon%20Smith">Email me</a>
      <a class="btn" href="{{ '/assets/resume/SolomonSmithResume.pdf' | relative_url }}">Download resume</a>
      <a class="btn" href="https://github.com/{{ site.github_username }}" rel="noopener">GitHub</a>
      <a class="btn" href="https://linkedin.com/in/{{ site.linkedin_username }}" rel="noopener">LinkedIn</a>
    </div>
    <p class="availability">{{ page.availability }}</p>
  </div>
  <img class="hero__photo" src="{{ '/assets/images/headshot.jpg' | relative_url }}" alt="Portrait of Solomon Smith" width="410" height="600" decoding="async" fetchpriority="high">
</section>

{{ content }}
