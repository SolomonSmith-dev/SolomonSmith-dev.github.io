title: "Solomon Smith"
description: "Solomon Smith. CS senior at CSU San Bernardino. AI/ML engineer building LLM pipelines, RAG systems, and multi-agent infrastructure. Open to Fall 2026 internships and full-time roles starting January 2027."
url: "https://solomonsmith.dev"
baseurl: ""
lang: en

author:
  name: "Solomon Smith"
  email: "solomonsmithdev@gmail.com"

email: "solomonsmithdev@gmail.com"
github_username: "SolomonSmith-dev"
linkedin_username: "solomonsmithdev"
bio: "CS senior at CSUSB building LLM pipelines, RAG systems, and multi-agent infrastructure. Open to Fall 2026 internships and AI/ML engineering roles starting January 2027."

# Build settings
theme: minima

minima:
  date_format: "%b %-d, %Y"
  social_links:
    github:   SolomonSmith-dev
    linkedin: solomonsmithdev

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation links (paths must match each page's source path)
header_pages:
  - about.md
  - projects.md
  - blog.md
  - resume.md

# SEO defaults
twitter:
  username: solomonsmithdev
  card: summary_large_image
social:
  name: Solomon Smith
  links:
    - https://github.com/SolomonSmith-dev
    - https://linkedin.com/in/solomonsmithdev

# Default og:image for all pages (jekyll-seo-tag picks up page.image)
# Use the 1200x630 social card for link previews; headshot remains on /about and /card.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og-default.png
        alt: "Solomon Smith. AI/ML engineer. Fall 2026 internships. Full-time January 2027."

# Exclude from processing
exclude:
  - docs/
  - CLAUDE.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - vendor/
