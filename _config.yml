title: "Solomon Smith"
description: "AI/ML engineer building LLM pipelines, RAG systems, and multi-agent infrastructure. CS senior at CSUSB, open to Summer 2026 internships."
url: "https://solomonsmith.dev"
baseurl: ""
lang: en

author:
  name: "Solomon Smith"
  email: "solomonsmithdev@gmail.com"

email: "solomonsmithdev@gmail.com"
github_username: "SolomonSmith-dev"
linkedin_username: "solomonsmithdev"
bio: "CS senior at CSUSB building LLM pipelines, RAG systems, and multi-agent infrastructure. Seeking internships Summer 2026 and AI/ML engineering roles starting January 2027."

# Build settings
theme: minima

sass:
  style: compressed

minima:
  date_format: "%b %-d, %Y"
  social_links:
    github:   SolomonSmith-dev
    linkedin: solomonsmithdev

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation links (paths must match each page's source path)
header_pages:
  - about.md
  - projects.md
  - blog.md
  - resume.md

# SEO defaults
twitter:
  username: solomonsmithdev
  card: summary
social:
  name: Solomon Smith
  links:
    - https://github.com/SolomonSmith-dev
    - https://linkedin.com/in/solomonsmithdev

# Default og:image for all pages (jekyll-seo-tag picks up page.image)
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/headshot.jpg
        alt: "Solomon Smith"
        width: 410
        height: 600

# Exclude from processing
exclude:
  - docs/
  - CLAUDE.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - vendor/
