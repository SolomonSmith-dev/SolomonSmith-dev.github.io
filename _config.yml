title: "Solomon Smith"
description: "Solomon Smith. CS senior at CSU San Bernardino. AI/ML engineer building LLM pipelines, RAG systems, and multi-agent infrastructure. Seeking internships Summer 2026 and full-time roles January 2027."
url: "https://solomonsmith.dev"
baseurl: ""
lang: en

author:
  name: "Solomon Smith"
  email: "solomonsmithdev@gmail.com"

email: "solomonsmithdev@gmail.com"
github_username: "SolomonSmith-dev"
linkedin_username: "solomonsmithdev"
bio: "CS senior at CSUSB building LLM pipelines, RAG systems, and multi-agent infrastructure. Seeking internships Summer 2026 and AI/ML engineering roles starting January 2027."

# Build settings
theme: minima

minima:
  date_format: "%b %-d, %Y"
  social_links:
    github:   SolomonSmith-dev
    linkedin: solomonsmithdev

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation links (paths must match each page's source path)
header_pages:
  - about.md
  - projects.md
  - blog.md
  - resume.md

# SEO defaults
twitter:
  username: solomonsmithdev
  card: summary

# Search Console / Bing verification (jekyll-seo-tag reads these).
# 1. Add https://solomonsmith.dev as a property in Google Search Console.
# 2. Choose the "HTML tag" method, copy the content value, paste it below, uncomment.
# 3. Deploy, verify, then submit https://solomonsmith.dev/sitemap.xml.
# webmaster_verifications:
#   google: "PASTE_GOOGLE_VERIFICATION_TOKEN"
#   bing: "PASTE_BING_VERIFICATION_TOKEN"

# Privacy-friendly analytics (opt-in). Nothing loads until a value is set.
# For Plausible: set the domain. For GA4: set the measurement id (G-XXXXXXX).
analytics:
  plausible_domain: ""   # e.g. solomonsmith.dev
  ga4_id: ""             # e.g. G-XXXXXXXXXX
social:
  name: Solomon Smith
  links:
    - https://github.com/SolomonSmith-dev
    - https://linkedin.com/in/solomonsmithdev

# Default og:image for all pages (jekyll-seo-tag picks up page.image)
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/headshot.jpg
        alt: "Solomon Smith"

# Exclude from processing
exclude:
  - docs/
  - CLAUDE.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - vendor/
