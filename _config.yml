title: "Solomon Smith"
description: "Solomon Smith, AI/Backend Engineer. I build LLM-backed features for products where a confident wrong answer costs more than no answer, and I write the tests that prove they refuse correctly. Founding Engineer at Recursa AI / CourtRules. Graduating December 2026. Open to full-time AI/ML and backend engineering roles starting January 2027."
url: "https://solomonsmith.dev"
baseurl: ""
lang: en

author:
  name: "Solomon Smith"
  email: "solomonsmithdev@gmail.com"

email: "solomonsmithdev@gmail.com"
github_username: "SolomonSmith-dev"
linkedin_username: "solomonsmithdev"
bio: "AI/Backend Engineer. I build LLM-backed features for products where a confident wrong answer costs more than no answer, and I write the tests that prove they refuse correctly. Founding Engineer at Recursa AI / CourtRules. Open to full-time AI/ML and backend engineering roles starting January 2027."

# Build settings
theme: minima
sass:
  style: compressed

minima:
  date_format: "%b %-d, %Y"
  social_links:
    github:   SolomonSmith-dev
    linkedin: solomonsmithdev

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Optional: set to your Plausible site domain to enable privacy-friendly analytics.
# Example: plausible_domain: "solomonsmith.dev"
# plausible_domain: ""

# Navigation links (paths must match each page's source path)
header_pages:
  - about.md
  - projects.md
  - blog.md
  - resume.md

# SEO defaults
twitter:
  username: solomonsmithdev
  card: summary_large_image
social:
  name: Solomon Smith
  links:
    - https://github.com/SolomonSmith-dev
    - https://linkedin.com/in/solomonsmithdev

# Default og:image for all pages (jekyll-seo-tag picks up page.image)
# Use the 1200x630 social card for link previews; headshot remains on /about and /card.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og-default.png
        alt: "Solomon Smith. AI/Backend Engineer. Open to full-time roles from January 2027."
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:slug/
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      wide: true

# Project pages: one file per project in _projects/, served at /projects/<slug>/
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Exclude from processing
exclude:
  - docs/
  - scripts/
  - CLAUDE.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - vendor/
